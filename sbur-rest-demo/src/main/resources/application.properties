# ==========================================
# Configuração do banco de dados MySQL
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/floricultura?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=SUA_SENHA_AQUI
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# Configuração do Hibernate/JPA
# ==========================================
# update = cria/atualiza tabelas automaticamente com base nas entidades (bom para dev)
# validate = so confere se bate com o schema existente (bom para producao)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ==========================================
# Porta da aplicação
# ==========================================
server.port=8080
